[workspace]
resolver = "2"
members = [
    "mosaic-core",
    "mosaic-auth",
    "mosaic-cli",
    "mosaic-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"

[workspace.dependencies]
mosaic-core = { path = "mosaic-core" }
mosaic-auth = { path = "mosaic-auth" }
sha2 = "0.10"
argon2 = "0.5"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
zeroize = { version = "1.8", features = ["derive"] }
