[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-credential"
version = "0.1.0"
description = "Python bindings and reference implementation for Mosaic Credential v1"
readme = "README.md"
authors = [{ name = "Mosaic Credential Team" }]
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "argon2-cffi>=21.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
